context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "DeepFilter Noise Cancelling Source (Stereo)"
        media.name       = "DeepFilter Noise Cancelling Source (Stereo)"
        filter.graph = {
            nodes = [
                {
                    type   = ladspa
                    name   = "DeepFilter Stereo"
                    plugin = "/usr/lib/ladspa/libdeep_filter_ladspa.so"
                    label  = "deep_filter_stereo"
                    control = {
                        "Attenuation Limit (dB)" = 100.0
                    }
                }
            ]
        }
        audio.rate     = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props = {
            node.name   = "deep_filter_stereo_input"
            node.passive = true
        }
        playback.props = {
            node.name   = "deep_filter_stereo_output"
            media.class = "Audio/Source"
        }
    }
}
]
